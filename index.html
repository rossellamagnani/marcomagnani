<title>Galleria Marco Magnani</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
  /* Layout: a full-screen WebGL corridor; HTML only for the name, the caption and the work sheet. Single light look by choice (a white gallery). */
  :root {
    --wall: #f7f7f7;
    --ink: #1d1c1a;
    --ink-soft: #747474;
    --rule: #e2e2e2;
    --sheet: rgba(250, 250, 250, 0.95);
    --placeholder: #9a9a9a;
    --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --text: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --header-h: 84px;
    --art-vh: 62vh;   /* altezza massima del dipinto in scheda e negli elenchi */
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--wall);
    color: var(--ink);
    font-family: var(--text);
    overflow: hidden;
    overscroll-behavior: none;
  }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

  /* Header: logo a sinistra, menu a destra; su schermi verticali il menu si apre a tutto schermo */
  .site-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: calc(var(--header-h) + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(28px, env(safe-area-inset-right, 0px)) 0 max(28px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(rgba(247,247,247,.92), rgba(247,247,247,.92) 70%, rgba(247,247,247,0));
  }
  .logo { display: block; line-height: 0; position: relative; z-index: 2; }
  .logo img { height: 46px; width: auto; display: block; }
  .nav { display: flex; gap: 36px; }
  .nav-link {
    color: var(--ink); text-decoration: none;
    font-size: 0.8rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 0; position: relative;
  }
  .nav-link::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.22,.8,.25,1); }
  .nav-link:hover::after, .nav-link:focus-visible::after, .nav-link[aria-current="page"]::after, .coll-open .coll-btn::after { transform: scaleX(1); }
  .menu-btn { display: none; }
  .coll-btn { border: 0; background: transparent; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; }
  .coll-btn svg { width: 9px; height: 6px; transition: transform .35s cubic-bezier(.22,.8,.25,1); }
  .coll-open .coll-btn svg { transform: rotate(180deg); }
  /* barra delle collezioni: si apre sotto l'header, tra due linee, con i nomi in fila */
  .coll-bar {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + var(--header-h));
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px clamp(24px, 3.4vw, 48px);
    padding: 15px max(28px, env(safe-area-inset-right, 0px)) 15px max(28px, env(safe-area-inset-left, 0px));
    background: #fff;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    opacity: 0; visibility: hidden; transform: translateY(-6px);
    transition: opacity .25s ease, transform .3s ease, visibility 0s linear .3s;
  }
  .coll-open .coll-bar { opacity: 1; visibility: visible; transform: none; transition: opacity .3s ease, transform .45s cubic-bezier(.22,.8,.25,1); }
  .coll-bar a {
    color: var(--ink); text-decoration: none; position: relative; padding: 6px 0;
    font-size: 0.75rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .coll-bar a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.22,.8,.25,1); }
  .coll-bar a:hover::after, .coll-bar a:focus-visible::after, .coll-bar a[aria-current="page"]::after { transform: scaleX(1); }
  /* briciole di pane della collezione, come una riga della tabella */
  .lv-crumbs {
    display: flex; align-items: center; gap: 12px;
    padding: 16px max(28px, env(safe-area-inset-right, 0px)) 16px max(28px, env(safe-area-inset-left, 0px));
    font-size: 0.85rem;
  }
  .lv-crumbs .lv-count { margin-left: auto; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
  .lv-crumbs button { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: var(--ink); }
  .lv-crumbs button:hover { text-decoration: underline; text-underline-offset: 4px; }
  .lv-crumbs i { font-style: normal; color: var(--ink-soft); }
  .lv-crumbs + .lv-series { border-top: 0; }

  .caption {
    position: fixed;
    left: max(24px, env(safe-area-inset-left, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: grid;
    gap: 2px;
    pointer-events: none;
    transition: opacity .5s ease;
  }
  .caption .series { font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
  .caption .title { font-family: var(--display); font-weight: 500; font-size: 1.1rem; }

  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    pointer-events: none;
    transition: opacity .8s ease;
  }
  .hint i { width: 1px; height: 34px; background: linear-gradient(var(--ink-soft), transparent); animation: drip 1.8s ease-in-out infinite; }
  @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
  .hidden-soft { opacity: 0; }


  /* Selettore di vista: al centro dell'header su schermi orizzontali, in basso su quelli verticali */
  .view-switch {
    position: fixed; z-index: 32; left: 50%;
    top: calc(env(safe-area-inset-top, 0px) + var(--header-h) / 2);
    transform: translate(-50%, -50%);
    display: flex; gap: 4px;
    transition: opacity .3s ease;
  }
  .view-switch button {
    border: 0; background: transparent; cursor: pointer; color: var(--ink-soft);
    font: 500 0.75rem/1 var(--text); letter-spacing: 0.14em; text-transform: uppercase;
    padding: 10px 12px; position: relative;
  }
  .view-switch button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 1px; background: currentColor; transform: scaleX(0); transition: transform .35s cubic-bezier(.22,.8,.25,1); }
  .view-switch button[aria-pressed="true"] { color: var(--ink); }
  .view-switch button[aria-pressed="true"]::after { transform: scaleX(1); }
  .view-switch button:hover { color: var(--ink); }
  body:has(.sheet.open) .view-switch, body:has(.menu-open) .view-switch { opacity: 0; pointer-events: none; }

  /* Vista a lista: dipinto a sinistra, testo a destra, linee sottili */
  .list-view {
    position: fixed; inset: 0; z-index: 15;
    overflow-y: auto; overscroll-behavior: contain;
    background: #fff;
    padding-top: calc(env(safe-area-inset-top, 0px) + var(--header-h));
    opacity: 0; visibility: hidden;
    transition: opacity .4s ease, visibility 0s linear .4s;
  }
  .list-view:focus { outline: none; }
  .list-view.open { opacity: 1; visibility: visible; transition: opacity .45s ease; }
  .lv-series {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: clamp(48px, 8vh, 88px) max(28px, env(safe-area-inset-right, 0px)) 18px max(28px, env(safe-area-inset-left, 0px));
    border-top: 1px solid var(--ink);
  }
  .lv-series:first-child { border-top: 0; }
  .lv-series h2 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 500; letter-spacing: -0.01em; }
  .lv-series span { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
  .lv-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-top: 1px solid var(--ink); }
  .lv-row:last-child { border-bottom: 1px solid var(--ink); }
  .lv-art {
    display: grid; place-items: center;
    min-height: min(80vh, 760px);
    padding: clamp(32px, 6vw, 80px);
    background: #f1f1f0;
    border-right: 1px solid var(--ink);
  }
  .lv-box {
    background: var(--placeholder);
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 14px 30px -16px rgba(0,0,0,.4);
  }
  .lv-info {
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: clamp(32px, 5vw, 72px);
    max-width: 640px;
  }
  .lv-info .lv-kicker { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
  .lv-info h3, .lv-info h2 { margin: 0 0 6px; font-size: 1rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  .lv-info p { margin: 0; font-size: 0.9rem; }
  .lv-info .lv-desc { margin-top: 14px; max-width: 56ch; }
  .lv-info .lv-desc p { margin: 0 0 0.8em; line-height: 1.65; color: #4a4a48; }
  .lv-info .lv-rest[hidden] { display: none; }
  .lv-info .lv-more { margin: 0 0 0.8em; padding: 0; border: 0; background: none; font: inherit; font-size: 0.85rem; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .lv-info .lv-more:hover { text-decoration-thickness: 2px; }
  .lv-info .lv-mount { margin-top: 2px; font-size: 0.85rem; line-height: 1.55; color: var(--ink-soft); max-width: 56ch; }
  .lv-info .lv-cta { margin-top: 12px; align-self: flex-start; color: var(--ink); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .lv-info .lv-cta:hover { text-decoration-thickness: 2px; }
  .lv-info .lv-sold { margin-top: 12px; font-size: 0.85rem; color: var(--ink-soft); }
  .lv-foot { height: 96px; }
  .lv-year {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px max(28px, env(safe-area-inset-right, 0px)) 18px max(28px, env(safe-area-inset-left, 0px));
    border-top: 1px solid var(--ink);
  }
  .lv-year h2 { margin: 0; font-size: 1.1rem; font-weight: 500; letter-spacing: 0.04em; }
  .lv-year span { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
  .lv-info .lv-text { line-height: 1.7; color: #2c2c2a; max-width: 58ch; font-size: 0.95rem; }
  .lv-info .lv-text + .lv-text { margin-top: 4px; }
  .lv-info .lv-lead { font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-weight: 500; letter-spacing: -0.01em; line-height: 1.15; margin: 0 0 4px; text-transform: none; }
  /* Artista e Contatti: pagine sobrie, una sola linea sotto il percorso, poi solo spazio */
  .ab { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); border-top: 1px solid var(--ink); }
  .ab-side { padding: clamp(28px, 5vh, 48px) max(28px, env(safe-area-inset-left, 0px)); }
  .ab-side > div { position: sticky; top: 24px; }
  .ab-side h2 { margin: 0 0 2px; font-size: 1rem; font-weight: 500; }
  .ab-side .ab-meta { margin: 0; font-size: 0.85rem; line-height: 1.6; color: var(--ink-soft); }
  .ab-text { padding: clamp(28px, 5vh, 48px) clamp(28px, 5vw, 80px) 40px; max-width: calc(62ch + 160px); }
  .ab-text h2 { margin: 0 0 2px; font-size: 1rem; font-weight: 500; }
  .ab-text .ab-meta { margin: 0 0 28px; font-size: 0.85rem; color: var(--ink-soft); }
  .ab-text p { margin: 0 0 1.2em; font-size: 0.98rem; line-height: 1.75; color: #2c2c2a; }
  .ab-text figure { margin: 2em 0 2.2em; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ab-text .ab-portrait { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; object-position: 50% 35%; margin: 0 0 32px; }
  .ab-text figure img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
  /* Contatti: solo righe sottili, etichetta piccola e dato, nient'altro */
  .ct-row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); }
  .lv-crumbs + .ct-row { border-top: 1px solid var(--ink); padding-top: clamp(12px, 3vh, 28px); }
  .ct-label { padding: 14px max(28px, env(safe-area-inset-left, 0px)); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); line-height: 1.9; }
  .ct-value { padding: 10px clamp(28px, 5vw, 80px) 14px; font-size: 1.05rem; line-height: 1.6; }
  .ct-value a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: rgba(29,28,26,.35); transition: text-decoration-color .3s; }
  .ct-value a:hover, .ct-value a:focus-visible { text-decoration-color: currentColor; }
  .lv-img { display: block; height: auto; max-width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 14px 30px -16px rgba(0,0,0,.4); background: #e4e4e2; }

  /* Work sheet */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #fff;
    padding-top: calc(env(safe-area-inset-top, 0px) + var(--header-h));
    overflow-y: auto;
    overscroll-behavior: contain;
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s ease, visibility 0s linear .35s;
  }
  .sheet.open { opacity: 1; visibility: visible; transition: opacity .4s ease; }
  .sheet-inner { min-height: 100%; border-bottom: 1px solid var(--ink); }
  .sheet .lv-art { min-height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px)); min-height: calc(100dvh - var(--header-h) - env(safe-area-inset-top, 0px)); }
  .sheet .lv-info { padding-top: clamp(64px, 10vh, 110px); justify-content: flex-start; }
  .sheet .lv-art { align-self: start; position: sticky; top: 0; }
  .sheet .info { opacity: 0; transform: translateY(10px); transition: opacity .25s ease, transform .25s ease; }
  .sheet.open .info { opacity: 1; transform: none; transition: opacity .55s ease .18s, transform .75s cubic-bezier(.22,.8,.25,1) .18s; }
  .art-box.parked { visibility: hidden; }
  .flyer {
    position: fixed; z-index: 22; margin: 0;
    background: var(--placeholder);
    transform-origin: 0 0;
    pointer-events: none;
    box-shadow: 0 18px 40px -18px rgba(29, 28, 26, .45);
    will-change: transform;
  }
  .art-box {
    background: var(--placeholder);
    max-width: 100%;
    max-height: min(62vh, 560px);
    box-shadow: 0 18px 40px -18px rgba(29, 28, 26, .45);
    display: grid;
    place-items: center;
    color: rgba(255,255,255,.75);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .close {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + var(--header-h) + 4px);
    right: max(16px, env(safe-area-inset-right, 0px));
    z-index: 21;
    width: 48px; height: 48px;
    border: 0; background: transparent; cursor: pointer;
    display: grid; place-items: center;
    color: var(--ink);
  }
  .close[hidden] { display: none; }
  .close svg { width: 26px; height: 26px; }
  .close:hover { opacity: .6; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* schermi stretti o verticali: opera in alto, scheda sotto */
  @media (max-width: 760px), (max-aspect-ratio: 1/1) {
    .sheet .lv-art { min-height: 0; padding: 40px 24px; position: static; }
    .sheet .lv-info { padding-top: 32px; }
    .caption .title { font-size: 1rem; }
    :root { --art-vh: 42vh; }
    .lv-row { grid-template-columns: minmax(0, 1fr); }
    .lv-art { min-height: min(92vw, 70vh); border-right: 0; border-bottom: 1px solid var(--ink); padding: 32px; }
    .ct-row { grid-template-columns: minmax(0, 1fr); }
    .ab { grid-template-columns: minmax(0, 1fr); }
    .ab-side { padding-bottom: 0; }
    .ab-side > div { position: static; }
    .ab-text figure { gap: 8px; }
    .ab-text { padding: 24px max(24px, env(safe-area-inset-left, 0px)) 40px; }
    .ct-label { padding: 18px max(24px, env(safe-area-inset-left, 0px)) 0; }
    .ct-value { padding: 4px max(24px, env(safe-area-inset-left, 0px)) 20px; }
    .lv-info { padding: 32px max(24px, env(safe-area-inset-left, 0px)) 44px; }
    .lv-series { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  }
  /* schermi verticali: menu a scomparsa */
  @media (max-aspect-ratio: 1/1) {
    :root { --header-h: 70px; }
    .site-header { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
    .logo img { height: 36px; }
    .menu-btn {
      display: grid; place-items: center; width: 48px; height: 48px;
      border: 0; background: transparent; cursor: pointer; color: var(--ink); position: relative; z-index: 2;
    }
    .menu-btn span { position: absolute; width: 24px; height: 1.5px; background: currentColor; transition: transform .4s cubic-bezier(.22,.8,.25,1); }
    .menu-btn span:first-child { transform: translateY(-4px); }
    .menu-btn span:last-child { transform: translateY(4px); }
    .menu-open .menu-btn span:first-child { transform: rotate(45deg); }
    .menu-open .menu-btn span:last-child { transform: rotate(-45deg); }
    .nav {
      position: fixed; inset: 0; z-index: 1;
      flex-direction: column; justify-content: center; gap: 10px;
      padding: 0 max(28px, env(safe-area-inset-left, 0px));
      background: var(--wall);
      opacity: 0; visibility: hidden;
      transition: opacity .35s ease, visibility 0s linear .35s;
    }
    .menu-open .nav { opacity: 1; visibility: visible; transition: opacity .4s ease; }
    .nav-link { font-size: 2.4rem; font-weight: 500; letter-spacing: -0.01em; text-transform: none; padding: 6px 0; align-self: flex-start;
      opacity: 0; transform: translateY(12px); transition: opacity .3s ease, transform .3s ease; }
    .menu-open .nav-link, .menu-open .coll-bar { opacity: 1; transform: none; transition: opacity .5s ease .12s, transform .7s cubic-bezier(.22,.8,.25,1) .12s; }
    .menu-open .nav > a { transition-delay: .2s; }
    .nav-link::after { bottom: 6px; }
    .coll-btn { gap: 14px; }
    .coll-btn svg { width: 16px; height: 10px; }
    .coll-bar {
      position: static; display: none; flex-direction: column; align-items: flex-start; gap: 2px;
      padding: 6px 0 14px 2px; border: 0; background: transparent; transform: none;
    }
    .coll-open .coll-bar { display: flex; }
    .coll-bar a { font-size: 0.95rem; padding: 8px 0; }
    .view-switch {
      top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%);
      background: rgba(255,255,255,.92); border: 1px solid var(--ink); border-radius: 999px; padding: 2px 6px;
    }
    .hint, .caption { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
    .lv-foot { height: 110px; }
    /* con la scheda aperta la X prende il posto del pulsante menu */
    body:has(.sheet.open) .menu-btn { visibility: hidden; }
    .close { top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(8px, env(safe-area-inset-right, 0px)); z-index: 31; }
  }
  @media (max-width: 640px) {
    .hint, .caption { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint i { animation: none; }
    .sheet, .sheet .info, .list-view, .lv-box, .lv-info { transition: none !important; }
    .lv-row.pre .lv-box, .lv-row.pre .lv-info { opacity: 1; transform: none; }
  }
</style>

    { s: "Trame", t: "Trama III", w: 40, h: 40, d: 2, frame: false, mount: "L'opera è concepita come parte integrante di un polittico a griglia e viene presentata all'interno della serie completa dei quattro elementi.", avail: true,

    { s: "Trame del silenzio", t: "Parola", w: 40, h: 40, d: 2, frame: false, mount: "L'opera è completata da una cornice artigianale in legno con montaggio floating, concepita per valorizzare la tela.", avail: true,
      tech: "Olio su tela, 40 × 40 cm",

    { s: "Gatti Kintsugi", t: "Gatto Kintsugi III", w: 20, h: 20, d: 3.8, frame: false, mount: "Olio su tela a spessore, concepita per l'esposizione senza cornice.", avail: false,
      tech: "Olio su tela, 20 × 20 × 3.8 cm",
      desc: ["In questa terza tela, la ricerca si sposta sulla massima preziosità materica. Il profilo del felino è interamente risolto nei toni di un nero profondo e denso, che assorbe la luce per restituirla unicamente lungo i vettori geometrici delle fenditure dorate. Il soggetto si staglia contro una campitura metallica che ne definisce la silhouette con assoluta precisione grafica. Un'opera solenne, giocata su riflessi cangianti e su un'estetica dal forte sapore architettonico."] },
    { s: "Trame", t: "Trama IV", w: 40, h: 40, d: 2, frame: false, mount: "L'opera è concepita come parte integrante di un polittico a griglia e viene presentata all'interno della serie completa dei quattro elementi.", avail: true,
      tech: "Olio su tela, 40 × 40 cm",
      desc: ["L'opera conclude la scansione della serie attraverso una composizione frontale dall'impatto visivo netto e assoluto. Il colore della trama si fa qui ocra caldo e vibrante, agendo come una temperatura cromatica satura che isola il pensiero. Il volto riceve una luminosità diffusa e zenitale, esasperando il corto circuito sensoriale tra la naturalezza dell'incarnato e l'artificiosità traforata della barriera tessile. Lo sguardo ieratico stabilisce l'ultimo contatto diretto con lo spettatore, sigillando la griglia come mappa ordinata di diverse sfumature di isolamento e bellezza."] },
    { s: "Gatti Pop", t: "Gatto Pop IV", w: 20, h: 20, d: 3.8, frame: false, mount: "Olio su tela a spessore, concepita per l'esposizione senza cornice.", avail: true,
      tech: "Olio su tela, 20 × 20 × 3.8 cm",

    { s: "Trame del silenzio", t: "Libertà", w: 60, h: 75, d: 2, frame: false, mount: "L'opera è completata da una cornice artigianale in legno con montaggio floating, concepita per valorizzare la tela.", avail: true,
      tech: "Olio su tela, 60 × 75 cm",
      desc: ["Il compimento del percorso sensoriale segna il passaggio definitivo dalla sottomissione alla sovranità. Lo sguardo finalmente si solleva e le mani stringono i fili dell'intreccio, governandone la direzione e l'intensità. La figura cessa di essere confinata dal limite e ne assume il controllo, convertendo il vincolo scarlatto nello strumento del proprio potere interiore; chi ha attraversato il silenzio dei sensi è ora il regista cosciente della propria architettura spirituale."] },
    { s: "Gatti Kintsugi", t: "Gatto Kintsugi IV", w: 20, h: 20, d: 3.8, frame: false, mount: "Olio su tela a spessore, concepita per l'esposizione senza cornice.", avail: true,
      tech: "Olio su tela, 20 × 20 × 3.8 cm",
      desc: ["La serie si conclude con la massima esasperazione del contrasto complementare. Marco Magnani veste il felino di un blu oltremare intenso e vibrante, solcato da trame dorate che ne illuminano i lineamenti del muso e la linea del petto. Lo sfondo arancione saturo, di grande impatto visivo, converte l'opera in un magnetico elemento di design dello spazio, capace di dialogare con le architetture moderne attraverso la forza del colore puro."] }
  ];
  // foto di ogni opera, ritagliata sulla tela: opere/<titolo>.jpg
  const fileSlug = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  works.forEach(w => { w.img = "opere/" + fileSlug(w.t) + ".jpg"; });
  const PHONE = "+39 348 4109 585";
  const WA = "393484109585";

  // ---------- Tre modi di far vedere i dipinti nella stessa curva continua ----------
  // L'anello si percorre in senso orario: curva sempre a sinistra e non finisce mai.
  const OPTIONS = {
    // Schermi orizzontali: opere solo sulla parete esterna (destra), che in curva viene incontro a chi cammina.
    galleria: { R: 14, W: 4.6, H: 4.0, sides: "right", camShift: -0.5, spacing: 2.6, tilt: 0, lookIn: -0.05, guided: false, scale: 2.3 },
    // Schermi verticali (telefono, iPad in verticale): opere solo sulla parete esterna, camminando vicino a quella interna.
    verticale: { R: 12, W: 3.8, H: 3.8, sides: "right", camShift: -0.4, spacing: 2.6, tilt: 0, lookIn: -0.06, guided: false, scale: 2.55 }
  };
  const EYE = 1.6;
  const SCALE = 2.0; // ingrandimento delle opere per leggibilità
  const VIEW_AHEAD = 1.3; // metri prima del dipinto in cui la vista guidata si ferma
  let opt, R, W, H, R_IN, R_OUT, SLOTS, DPHI;
  let hoverGroup = null, shownWork = -1;

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));

  const BG = 0xf7f7f7;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 8, 32);
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 90);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xcdcdcd, 0.6));
  scene.add(new THREE.AmbientLight(0xffffff, 0.16));
  const sun = new THREE.DirectionalLight(0xffffff, 0.22);
  sun.position.set(0.4, 1, 0.25); scene.add(sun);
  const lamp = new THREE.PointLight(0xffffff, 0.4, 14, 1.6);
  scene.add(lamp);

  const WALL_GAP = 0.02;   // distanza del punto d'aggancio dalla parete (le facce della parete sono poligoni)
  const world = new THREE.Group();
  scene.add(world);

  // Texture di un'ombra sfocata: "core" è la frazione della texture occupata dal rettangolo pieno
  function shadowTexture(core, blur) {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const x = c.getContext("2d");
    const side = Math.round(256 * core), o = (256 - side) / 2;
    x.shadowColor = "rgba(0,0,0,1)"; x.shadowBlur = blur; x.shadowOffsetX = 1000;
    x.fillStyle = "#000"; x.fillRect(-1000 + o, o, side, side);
    return new THREE.CanvasTexture(c);
  }
  const shadowTex = shadowTexture(0.6, 38);           // usata solo dalle lame (soluzione non più attiva)

  // Ombra disegnata su misura per ogni tela, in metri reali (nessuna deformazione per i formati non quadrati).
  // Luce dall'alto e leggermente frontale: linea di contatto netta lungo i bordi + ombra portata verso il basso
  // che si allunga e si ammorbidisce con lo spessore della tela.
  const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
  function paintingShadow(w, h, d) {
    const M = 0.1 + d * 2.2;                         // margine attorno alla tela
    const TW = w + 2 * M, TH = h + 2 * M;
    const ppm = Math.min(360, 1400 / Math.max(TW, TH)); // pixel per metro
    const c = document.createElement("canvas");
    c.width = Math.round(TW * ppm); c.height = Math.round(TH * ppm);
    const x = c.getContext("2d");
    const rect = (dy, blur, a, grow = 0) => {
      x.shadowColor = `rgba(0,0,0,${a})`; x.shadowBlur = blur * ppm; x.shadowOffsetX = 4000;
      x.fillStyle = "#000";
      x.fillRect((M - grow) * ppm - 4000, (M - grow + dy) * ppm, (w + 2 * grow) * ppm, (h + 2 * grow) * ppm);
    };
    rect(0.035, 0.09, 0.07);                 // penombra ampia, appena percettibile
    rect(d * 1.05, d * 0.9 + 0.012, 0.3);    // ombra portata verso il basso
    rect(0.002, 0.008, 0.38, 0.001);         // contatto: filo scuro che segue i bordi
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = MAX_ANISO;
    return { tex: t, TW, TH };
  }

  const texLoader = new THREE.TextureLoader();
  function averageColor(img) {
    try {
      const c = document.createElement("canvas"); c.width = c.height = 8;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, 8, 8);
      const d = x.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
      const n = d.length / 4;
      return new THREE.Color(r / n / 255, g / n / 255, b / n / 255);
    } catch (e) { return new THREE.Color(0x444444); }
  }

  // ---------- Costruzione ----------
  const greys = [0x9a9a9a, 0x8d8d8d, 0xa6a6a6, 0x858585];
  const pickables = [];
  const frames = [];
  const SEG = 400;

  function ringFlat(r1, r2, y, color, up) {

  function buildWorld(key) {
    world.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    while (world.children.length) world.remove(world.children[0]);
    pickables.length = 0; frames.length = 0; hoverGroup = null; shownWork = -2;
    canvas.style.cursor = "default";

    opt = OPTIONS[key];
    R = opt.R; W = opt.W; H = opt.H; R_IN = R - W / 2; R_OUT = R + W / 2;
    SLOTS = Math.max(1, Math.round((2 * Math.PI * R) / opt.spacing / works.length)) * works.length;
    DPHI = (Math.PI * 2) / SLOTS;

    const wallMat = new THREE.MeshStandardMaterial({ color: 0xfbfbfb, emissive: 0x9a9a9a, roughness: 1, side: THREE.DoubleSide });
    [R_IN, R_OUT].forEach(r => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, H, SEG, 1, true), wallMat);
      m.position.y = H / 2; world.add(m);
    });
    ringFlat(R_IN, R_OUT, 0, 0xdedede, true);
    const ceil = new THREE.Mesh(new THREE.RingGeometry(R_IN, R_OUT, SEG, 1), new THREE.MeshBasicMaterial({ color: 0xf1f1f1, side: THREE.DoubleSide }));
    ceil.rotation.x = Math.PI / 2; ceil.position.y = H; world.add(ceil);

    const bladeShadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity: 0.16, depthWrite: false });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2b2724, roughness: 0.7 });
    const insetMat = new THREE.MeshStandardMaterial({ color: 0x1f1c1a, roughness: 1 });
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0xfdfdfc, roughness: 0.9 });
    const tilt = THREE.MathUtils.degToRad(opt.tilt);

    for (let k = 0; k < SLOTS; k++) {
      const wi = k % works.length;
      const work = works[wi];
      const left = opt.sides === "both" ? k % 2 === 0 : false;
      const phi = -(k + 0.7) * DPHI;
      const radial = new THREE.Vector3(Math.cos(phi), 0, Math.sin(phi));
      const fwd = new THREE.Vector3(Math.sin(phi), 0, -Math.cos(phi)); // direzione di marcia in quel punto
      const nWall = left ? radial.clone() : radial.clone().negate();  // normale della parete verso il corridoio
      const rWall = left ? R_IN : R_OUT;

      const sc = opt.scale || SCALE;
      const w = work.w / 100 * sc, h = work.h / 100 * sc, d = work.d / 100 * sc;
      const centerY = Math.max(1.6, h / 2 + 0.6);
      const g = new THREE.Group();

      let z0 = 0.01;
      if (tilt > 0) {
        // Lama bianca che si stacca dalla parete e ruota il dipinto verso chi arriva
        const bw = w + (work.frame ? 0.7 : 0.5), bh = h + (work.frame ? 0.7 : 0.6), bt = 0.06;
        const n = nWall.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(fwd, -Math.sin(tilt)).normalize();
        const out = (bw / 2) * Math.sin(tilt) + 0.04;
        const base = radial.clone().multiplyScalar(rWall).addScaledVector(nWall, out);
        g.position.set(base.x, centerY, base.z);
        g.lookAt(g.position.clone().add(n));
        const blade = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bt), bladeMat);
        blade.position.z = -bt / 2; g.add(blade);
        // ombra morbida della lama sulla parete
        const ws = new THREE.Mesh(new THREE.PlaneGeometry(bw * 1.4, bh * 1.25), bladeShadowMat);
        const wp = radial.clone().multiplyScalar(rWall).addScaledVector(nWall, 0.01).addScaledVector(fwd, (bw / 2) * Math.cos(tilt) * 0.35);
        ws.position.set(wp.x, centerY - 0.05, wp.z);
        ws.lookAt(ws.position.clone().add(nWall));
        world.add(ws);
      } else {
        const p = radial.clone().multiplyScalar(rWall).addScaledVector(nWall, WALL_GAP);
        g.position.set(p.x, centerY, p.z);
        g.lookAt(g.position.clone().add(nWall));
        // La parete è curva: la tela (piatta) appoggia sulla parete, e l'ombra segue la curva della parete
        const sag = xx => rWall - Math.sqrt(rWall * rWall - xx * xx);
        const wallZ = xx => -WALL_GAP + (left ? -sag(xx) : sag(xx));
        z0 = (left ? wallZ(0) : wallZ(w / 2)) + 0.001;
        const sh = paintingShadow(w, h, d + (z0 - wallZ(0)));
        const geo = new THREE.PlaneGeometry(sh.TW, sh.TH, 40, 1);
        const pa = geo.attributes.position;
        for (let i = 0; i < pa.count; i++) pa.setZ(i, wallZ(pa.getX(i)) + 0.003);
        const shadow = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: sh.tex, transparent: true, depthWrite: false }));
        shadow.renderOrder = 1; g.add(shadow);
      }

      // faccia dipinta senza ombreggiatura: mostra il colore vero dell'opera, identico a quello della scheda
      const base = greys[wi % greys.length];
      const mat = new THREE.MeshBasicMaterial({ color: base });
      mat.userData.base = base;
      const edgeCol = k => new THREE.MeshBasicMaterial({ color: new THREE.Color(base).multiplyScalar(k) });
      const sideM = edgeCol(0.86), topM = edgeCol(1.1), botM = edgeCol(0.62);
      // la foto dell'opera sulla faccia della tela; i bordi prendono il colore medio del dipinto
      texLoader.load(work.img, tex => {
        tex.anisotropy = MAX_ANISO;
        mat.map = tex; mat.userData.base = 0xffffff;
        mat.color.setHex(hoverGroup && hoverGroup.userData.mat === mat ? 0xe0e0e0 : 0xffffff);
        mat.needsUpdate = true;
        const avg = averageColor(tex.image);
        [[sideM, 0.86], [topM, 1.1], [botM, 0.62]].forEach(([m, k]) => m.color.copy(avg).multiplyScalar(k));
      });
      if (work.frame) {
        const fd = 0.06;
        const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.26, h + 0.26, fd), frameMat);
        frame.position.z = fd / 2 + 0.01; g.add(frame);
        const inset = new THREE.Mesh(new THREE.PlaneGeometry(w + 0.16, h + 0.16), insetMat);
        inset.position.z = fd + 0.011; g.add(inset);
        frame.userData.work = wi; pickables.push(frame);
        z0 = fd + 0.02;
      }
      const canvasMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [sideM, sideM, topM, botM, mat, botM]);
      canvasMesh.position.z = z0 + d / 2; g.add(canvasMesh);
      canvasMesh.userData.work = wi; pickables.push(canvasMesh);

      g.userData = { work: wi, mat, phi, left, canvasMesh, arc: (k + 0.7) * DPHI * R };
      frames.push(g);
      world.add(g);
    }

  }

  // ---------- Movimento: solo avanti e indietro, vista fissa ----------
  let target = 0, pos = 0, vel = 0, last = performance.now(), lastInput = 0, snapped = true;
  let yaw = 0, side = 0;
  let sheetOpen = false, walked = false;
  const hint = document.getElementById("hint");

  let listOpen = false, listSince = 0, canvasParked = false;
  // ---------- Menu (a scomparsa su schermi verticali) ----------
  const siteHeader = document.getElementById("siteHeader");
  const menuBtn = document.getElementById("menuBtn");
  let menuOpen = false;
  function setMenu(open) {
    menuOpen = open;
    if (!open && typeof setColl === "function") setColl(false);
    siteHeader.classList.toggle("menu-open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
    menuBtn.setAttribute("aria-label", open ? "Chiudi il menu" : "Apri il menu");
  }
  menuBtn.addEventListener("click", () => setMenu(!menuOpen));
  document.getElementById("siteNav").addEventListener("click", e => { if (e.target.closest("a.nav-link")) setMenu(false); });
  matchMedia("(max-aspect-ratio: 1/1)").addEventListener("change", e => { if (!e.matches) setMenu(false); });

  function walk(delta) {
    if (sheetOpen || menuOpen || listOpen) return;
    target += delta;
    lastInput = performance.now();
    snapped = false;
    if (!walked && Math.abs(target) > 0.6) { walked = true; hint.classList.add("hidden-soft"); }
  }

  addEventListener("wheel", e => {
    if (sheetOpen || menuOpen || listOpen) return;   // lascia scorrere scheda e collezioni
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 18 : e.deltaMode === 2 ? innerHeight : 1;
    walk(e.deltaY * unit * 0.006);
  }, { passive: false });

  let touchY = null;
  let touchT = 0, touchV = 0;
  canvas.addEventListener("touchstart", e => { touchY = e.touches[0].clientY; touchT = performance.now(); touchV = 0; }, { passive: true });
  canvas.addEventListener("touchmove", e => {
    if (touchY == null) return;
    const y = e.touches[0].clientY;
    const d = (touchY - y) * 0.019, now = performance.now(), ddt = Math.max(8, now - touchT);
    walk(d);
    touchV = touchV * 0.6 + (d / ddt) * 1000 * 0.4; // velocità del dito (m/s), smussata
    touchY = y; touchT = now;
  }, { passive: true });
  // lasciando il dito il passo prosegue un poco per inerzia, come in una lista che scorre
  canvas.addEventListener("touchend", () => {
    if (touchY != null && performance.now() - touchT < 120) walk(Math.max(-4, Math.min(4, touchV * 0.22)));
    touchY = null; touchV = 0;
  });

  addEventListener("keydown", e => {
    if (e.key === "Escape" && collOpen) { setColl(false); collBtn.focus(); return; }
    if (e.key === "Escape" && menuOpen) { setMenu(false); menuBtn.focus(); return; }
    if (menuOpen || listOpen) return;
    if (e.key === "Escape" && sheetOpen) { closeSheet(); return; }
    if (sheetOpen) return;
    const step = opt && opt.guided ? opt.spacing : 3.2;
    if (["ArrowUp", "ArrowRight", "PageDown", " "].includes(e.key)) { walk(step); e.preventDefault(); }
    if (["ArrowDown", "ArrowLeft", "PageUp"].includes(e.key)) { walk(-step); e.preventDefault(); }
  });

  // Vista guidata: quando smetti di scorrere, il passo si ferma davanti al dipinto più vicino
  function snapTarget() {
    const C = 2 * Math.PI * R;
    const lap = Math.floor(target / C) * C;
    let best = target, bestD = Infinity;
    for (const g of frames) {
      for (const L of [lap - C, lap, lap + C]) {
        const stop = L + g.userData.arc - VIEW_AHEAD;
        const dd = Math.abs(stop - target);
        if (dd < bestD) { bestD = dd; best = stop; }
      }
    }
    target = best;
  }

  // ---------- Click sulle opere ----------
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let down = null;

  function pick(clientX, clientY) {
    ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    if (!hit || hit.distance > 12) return null;
    return hit.object;
  }

  canvas.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || sheetOpen) return;
    const obj = pick(e.clientX, e.clientY);
    const g = obj ? obj.parent : null;
    if (g !== hoverGroup) {
      if (hoverGroup) hoverGroup.userData.mat.color.setHex(hoverGroup.userData.mat.userData.base);
      hoverGroup = g;
      if (g) g.userData.mat.color.setHex(g.userData.mat.userData.base).multiplyScalar(0.88);
      canvas.style.cursor = g ? "pointer" : "default";
    }
  });
  canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener("pointerup", e => {
    if (!down || sheetOpen) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    if (moved < 8 && performance.now() - down.t < 600) {
      const obj = pick(e.clientX, e.clientY);
      if (obj) openSheet(obj.parent);
    }
    down = null;
  });

  // ---------- Scheda opera ----------
  const sheet = document.getElementById("sheet");
  const closeBtn = document.getElementById("closeBtn");
  const artBox = document.getElementById("artBox");

  // Rettangolo che il dipinto occupa adesso sullo schermo (faccia anteriore della tela)
  function paintingRect(g) {
    const m = g.userData.canvasMesh, p = m.geometry.parameters;
    m.updateMatrixWorld(true);
    const xs = [], ys = [];
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const v = new THREE.Vector3(sx * p.width / 2, sy * p.height / 2, p.depth / 2).applyMatrix4(m.matrixWorld).project(camera);
      xs.push((v.x + 1) / 2 * innerWidth); ys.push((1 - v.y) / 2 * innerHeight);
    }
    const left = Math.min(...xs), top = Math.min(...ys);
    return { left, top, width: Math.max(...xs) - left, height: Math.max(...ys) - top };
  }

  // Sposta un elemento da un rettangolo all'altro con una sola trasformazione (fluida anche su telefono)
  function fly(from, to, duration) {
    const el = document.createElement("div");
    el.className = "flyer";
    el.style.background = artBox.style.background;
    Object.assign(el.style, { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" });
    document.body.append(el);
    const start = `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width}, ${from.height / to.height})`;
    const anim = el.animate([{ transform: start }, { transform: "none" }], { duration, easing: "cubic-bezier(.65, 0, .2, 1)", fill: "both" });
    return anim.finished.catch(() => {}).then(() => el);
  }

  // ---------- Avvicinamento al dipinto ----------
  // Al click è la camera a muoversi: avanza lungo la curva, si gira e si ferma di fronte al quadro,
  // in modo che il quadro occupi esattamente il riquadro dell'opera nella scheda. Poi la scheda compare intorno.
  let activeGroup = null, focus = null, camAnim = null, mismatch = false;
  const dummy = new THREE.PerspectiveCamera();
  const poseA = { pos: new THREE.Vector3(), q: new THREE.Quaternion() };
  const poseB = { pos: new THREE.Vector3(), q: new THREE.Quaternion() };
  // curva morbida: accelera e frena piano, con un picco di velocità basso (meno nausea)
  const easeInOut = t => (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, t)))) / 2;
  // la rotazione finale si assesta più in fretta (coda meno lunga)
  const easeTurn = x => easeInOut(Math.pow(Math.min(1, Math.max(0, x)), 0.8));
  const BACK = 3.4; // dopo la X ci si ferma qui prima del quadro: resta il primo sulla destra
  let activeArc = 0;
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  function walkPose(p, out) {
    const theta = -p / R, camR = R + opt.camShift + side;
    out.pos.set(Math.cos(theta) * camR, EYE, Math.sin(theta) * camR);
    const fx = Math.sin(theta), fz = -Math.cos(theta);
    const lx = -Math.cos(theta), lz = -Math.sin(theta);
    const a = opt.lookIn + yaw;
    dummy.position.copy(out.pos);
    dummy.up.set(0, 1, 0);
    dummy.lookAt(out.pos.x + fx * Math.cos(a) + lx * Math.sin(a), EYE - 0.02, out.pos.z + fz * Math.cos(a) + lz * Math.sin(a));
    out.q.copy(dummy.quaternion);
  }

  // Posa frontale: il centro della tela finisce al centro del riquadro, alla sua stessa altezza in pixel
  function focusPose(g, rect, out) {
    const m = g.userData.canvasMesh, p = m.geometry.parameters;
    m.updateMatrixWorld(true);
    const center = new THREE.Vector3(0, 0, p.depth / 2).applyMatrix4(m.matrixWorld);
    const n = new THREE.Vector3(0, 0, 1).transformDirection(m.matrixWorld);
    const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    let D = p.height / (2 * (rect.height / innerHeight) * tanV);
    D = Math.min(D, W - 0.4); // non si esce dal corridoio: oltre, il quadro resta un po' più piccolo
    const ndcX = ((rect.left + rect.width / 2) / innerWidth) * 2 - 1;
    const ndcY = -(((rect.top + rect.height / 2) / innerHeight) * 2 - 1);
    dummy.position.copy(center).addScaledVector(n, D);
    dummy.up.set(0, 1, 0);
    dummy.lookAt(center);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(dummy.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(dummy.quaternion);
    dummy.position.addScaledVector(right, -ndcX * D * tanV * camera.aspect).addScaledVector(up, -ndcY * D * tanV);
    out.pos.copy(dummy.position);
    out.q.copy(dummy.quaternion);
  }

  // le prime frasi sempre visibili, il resto (anche dello stesso paragrafo) dietro "Leggi tutto"
  function descParts(paras) {
    const mk = t => { const p = document.createElement("p"); p.textContent = t; return p; };
    const sent = paras[0].match(/[^.!?]+[.!?]+(?:\s+|$)/g) || [paras[0]];
    let head = "", k = 0;
    while (k < sent.length && (head.length < 150 || k === 0)) head += sent[k++];
    const tail = sent.slice(k).join("");
    if (!tail.trim() && paras.length === 1) return [mk(paras[0])];
    const first = mk(head.trimEnd());
    const more = document.createElement("span");
    more.className = "lv-rest"; more.hidden = true; more.textContent = " " + tail.trim();
    if (tail.trim()) first.append(more);
    const rest = paras.slice(1).map(t => { const p = mk(t); p.className = "lv-rest"; p.hidden = true; return p; });
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "lv-more"; btn.textContent = "Leggi tutto";
    btn.setAttribute("aria-expanded", "false");
    btn.addEventListener("click", () => {
      const open = btn.getAttribute("aria-expanded") !== "true";
      more.hidden = !open; rest.forEach(p => { p.hidden = !open; });
      btn.textContent = open ? "Riduci" : "Leggi tutto";
      btn.setAttribute("aria-expanded", String(open));
    });
    return [first, ...rest, btn];
  }

  function fillSheet(w, base) {
    artBox.style.background = `#8f8f8f url("${w.img}") center / cover no-repeat`;
    artBox.textContent = "";
    artBox.setAttribute("role", "img"); artBox.setAttribute("aria-label", w.t);
    document.getElementById("sheetSeries").textContent = w.s;
    document.getElementById("sheetTitle").textContent = `${w.t}, 2026`;
    document.getElementById("sheetSize").textContent = w.tech;
    document.getElementById("sheetMount").textContent = w.mount;
    document.getElementById("sheetMount").hidden = !w.mount;
    document.getElementById("sheetDesc").replaceChildren(...descParts(w.desc));
    const ratio = w.w / w.h;
    artBox.style.aspectRatio = `${w.w} / ${w.h}`;
    const maxH = innerWidth / innerHeight < 1 || innerWidth <= 760 ? "42vh" : "62vh";
    artBox.style.height = "auto";
    artBox.style.maxHeight = "none";
    artBox.style.width = `min(100%, ${ratio >= 1 ? 520 : 400}px, calc(${maxH} * ${ratio.toFixed(4)}))`;
    const actions = document.getElementById("sheetActions");
    actions.replaceChildren();
    if (w.avail) {
      const a = document.createElement("a");
      a.className = "lv-cta";
      a.href = `https://wa.me/${WA}?text=${encodeURIComponent(`Buongiorno, vorrei informazioni sull'opera "${w.t}" (${w.s}).`)}`;
      a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Richiedi informazioni";
      actions.append(a);
    } else {
      const p = document.createElement("p"); p.className = "lv-sold"; p.textContent = "Già in collezione privata";
      actions.append(p);
    }
  }

  function openSheet(g) {
    if (sheetOpen || camAnim) return;
    fillSheet(works[g.userData.work], g.userData.mat.userData.base);
    if (hoverGroup) { hoverGroup.userData.mat.color.setHex(hoverGroup.userData.mat.userData.base); hoverGroup = null; canvas.style.cursor = "default"; }
    sheetOpen = true;
    activeGroup = g;
    sheet.scrollTop = 0;
    const rect = artBox.getBoundingClientRect();

    // dove fermarsi lungo la curva: poco prima del quadro (se è già vicino, si resta dove si è)
    const C = 2 * Math.PI * R;
    const arcLap = g.userData.arc + C * Math.round((pos + 4 - g.userData.arc) / C);
    const p0 = pos, v0 = reduceMotion ? 0 : vel;
    vel = 0;
    caption.classList.add("hidden-soft");
    const stop = arcLap - p0 > 1.6 ? arcLap - 1.6 : p0;
    target = pos = p0;
    focusPose(g, rect, poseB);

    const show = () => {
      focus = poseB;
      camera.position.copy(poseB.pos); camera.quaternion.copy(poseB.q);
      camera.updateMatrixWorld(true);
      sheet.classList.add("open");
      closeBtn.hidden = false;
      closeBtn.focus({ preventScroll: true });
      // se il quadro non ha potuto riempire il riquadro (opere molto grandi), lo si accompagna per l'ultimo tratto
      const pr = paintingRect(g);
      mismatch = Math.abs(pr.height - rect.height) > 6;
      if (mismatch && !reduceMotion) {
        artBox.classList.add("parked");
        fly(pr, rect, 520).then(el => { artBox.classList.remove("parked"); el.remove(); });
      }
    };
    if (reduceMotion) { pos = target = stop; show(); return; }
    // prima si cammina lungo la curva, poi ci si gira verso il quadro: le due fasi si sovrappongono poco
    activeArc = arcLap;
    // la camminata ha la stessa velocità di prima; la rotazione verso il quadro dura 1,6 s e parte verso la fine del passo
    const walkDist = Math.abs(stop - p0);
    let walkMs = walkDist > 0.5 ? 0.6 * Math.min(4400, Math.max(2600, 2600 + walkDist * 260)) : 0;
    let walkTo = stop;
    // se stavi camminando e il quadro è già lì, il passo si spegne dolcemente invece di fermarsi di colpo
    if (!walkMs && Math.abs(v0) > 0.25) { walkMs = 650; walkTo = p0 + v0 * 0.22; }
    // slancio iniziale limitato: il passo non supera mai il punto d'arrivo per poi tornare indietro
    const span = walkTo - p0;
    let m0 = v0 * (walkMs / 1000);
    if (Math.sign(m0) === Math.sign(span)) m0 = Math.sign(m0) * Math.min(Math.abs(m0), 2.5 * Math.abs(span));
    else m0 = Math.sign(m0) * Math.min(Math.abs(m0), 0.4);
    const turnMs = 1600;
    const turnAt = walkMs ? Math.max(0, walkMs - 1100) : 0;
    const dur = Math.max(walkMs, turnAt + turnMs);
    camAnim = {
      t0: null, dur,
      step(t) {
        const ms = t * dur;
        // curva di Hermite: parte con la velocità che avevi e arriva ferma
        let p = p0;
        if (walkMs) {
          const u = Math.min(1, Math.max(0, ms / walkMs)), u2 = u * u, u3 = u2 * u;
          p = (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * walkTo;
        }
        pos = target = p;
        walkPose(p, poseA);
        const w = easeTurn((ms - turnAt) / turnMs);
        camera.position.lerpVectors(poseA.pos, poseB.pos, w);
        camera.quaternion.copy(poseA.q).slerp(poseB.q, w);
      },
      done: show
    };
  }

  function closeSheet() {
    if (!sheetOpen || camAnim || !focus) return;
    const g = activeGroup;
    closeBtn.hidden = true;
    if (mismatch && !reduceMotion && g) {
      const rect = artBox.getBoundingClientRect();
      artBox.classList.add("parked");
      fly(rect, paintingRect(g), 420).then(el => { artBox.classList.remove("parked"); el.remove(); });
    }
    sheet.classList.remove("open");
    const end = () => { focus = null; activeGroup = null; sheetOpen = false; vel = 0; shownWork = -2; canvas.focus({ preventScroll: true }); };
    const from = pos, back = Math.min(pos, activeArc - BACK);
    if (reduceMotion) { pos = target = back; end(); return; }
    setTimeout(() => {
      focus = null;
      camAnim = {
        t0: null, dur: 1800,
        step(t) {
          const p = from + (back - from) * easeInOut(t);
          pos = target = p;
          walkPose(p, poseA);
          const w = 1 - easeTurn(t);
          camera.position.lerpVectors(poseA.pos, poseB.pos, w);
          camera.quaternion.copy(poseA.q).slerp(poseB.q, w);
        },
        done: end
      };
    }, 220);
  }
  closeBtn.addEventListener("click", closeSheet);
  sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });

  // ---------- Collezioni: voce del menu con la barra dei nomi; ogni nome apre l'elenco delle sue opere ----------
  const listView = document.getElementById("listView");
  const collBtn = document.getElementById("collBtn");
  const collBar = document.getElementById("collBar");
  let rowObserver = null, currentSeries = null, collOpen = false;
  const seriesOrder = [];
  works.forEach(w => { if (!seriesOrder.includes(w.s)) seriesOrder.push(w.s); });
  const slug = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const countLabel = n => n === 1 ? "1 opera" : `${n} opere`;
  const hexOf = i => "#" + greys[i % greys.length].toString(16).padStart(6, "0");
  if ("IntersectionObserver" in window && !reduceMotion) {
    rowObserver = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.remove("pre"); rowObserver.unobserve(e.target); } }),
      { root: listView, rootMargin: "0px 0px -8% 0px" });
  }

  for (const name of seriesOrder) {
    const a = el("a", null, name);
    a.href = "#collezioni/" + slug(name);
    a.dataset.series = name;
    a.addEventListener("click", e => { e.preventDefault(); setColl(false); setMenu(false); showSeries(name); });
    collBar.append(a);
  }
  function setColl(open) {
    collOpen = open;

  const ARTIST_TEXT = ["Il percorso artistico di Marco Magnani affonda le sue radici nei contesti culturali di Lucca e nelle atmosfere sospese di Salsomaggiore Terme, luoghi che hanno nutrito la sua sensibilità visiva fin dagli esordi. La sua formazione è quella di un autodidatta che ha saputo trasformare un talento naturale in una disciplina ferrea: un percorso di ricerca autonoma che, lontano dai binari accademici tradizionali, lo ha portato ad attraversare generi e linguaggi, per decodificarli e ricomporli in una firma estetica rigorosa. Lungi dall’essere un limite, questa libertà d’origine ha consentito all'artista di elevare l'istinto a un protocollo metodologico assoluto, affinato in anni di dedizione ossessiva alla tecnica e alla tenuta strutturale del dipinto. È da questo lungo processo di maturazione che è nata la sua attuale cifra stilistica, un linguaggio capace di sintetizzare la memoria della forma classica con l'esigenza di una presenza contemporanea.", "Ogni manufatto emerge da una struttura disegnata netta e definita, sviluppandosi attraverso una stratificazione paziente di velature sottili e sovrapposte. Questa tecnica antica eleva la superficie pittorica, conferendole una profondità cromatica che impone allo sguardo una sosta solenne.", "In questa indagine, la percezione occupa un ruolo centrale. Magnani opera una divinizzazione del figurativo e definisce una nuova grammatica della figura attraverso un impianto basato sulla sottrazione, sull'isolamento del soggetto e sull'equilibrio delle superfici. La sua ricerca supera il dato puramente pittorico per farsi progettuale: la tela diventa lo spazio di un’interazione in cui l'elemento figurativo e la densità del pigmento si fondono in una sintesi strutturale impeccabile.", "I soggetti vengono estratti dal contesto quotidiano per essere trasfigurati in icone contemporanee, spesso schermati o ridefiniti da filtri materici, geometrie e textures che si configurano come un varco sensoriale. L’inserto materico agisce come diaframma e perimetro, uno strumento per ridefinire i volumi, attutire il rumore del mondo esterno e proteggere l'intimità del pensiero.", "Le figure manifestano una staticità deliberata; prive di narrazione o movimento, esse affermano la propria forza nell'essere, non nel fare, generando una fissità cerimoniale capace di sospendere la dimensione temporale.", "In un’epoca dominata dall’immateriale, Marco Magnani riafferma la necessità di oggetti dotati di una forte presenza fisica e materica, capaci di abitare e nobilitare gli ambienti. Integrare una sua opera nel proprio spazio significa accogliere un’icona di silenzio e rigore formale. Il lavoro dell’artista si muove sulla soglia sottile tra l’evidenza del volto e la difesa dell’identità: le figure non si offrono allo sguardo in modo immediato, ma reclamano attenzione, celebrando il valore del limite in un mondo saturo di esposizione visiva.", "La profondità delle campiture assolute e la precisione dell’innesto materico trasformano ogni tela in un fondamento architettonico, un atto di resistenza contro la fretta che permette alle opere di dialogare con naturalezza sia con i contesti curatoriali d'avanguardia, sia con i volumi dell'architettura d'interni di alto profilo.", "L'arte non viene confinata ai circuiti convenzionali, ma diviene un’esperienza viva e atemporale: un compagno di vita silenzioso che definisce il perimetro estetico degli spazi, dedicato a chi comprende che la vera forza di un’immagine risiede nella sua capacità di custodire un segreto."];

  function renderArchive() {

  function setListOpen(open) {

  }

  // apre una collezione: dalla galleria con una dissolvenza, da un'altra collezione cambiando il contenuto
  let swapTimer = 0;
  function showSeries(name, fromHash) {
    if (sheetOpen) return;
    if (!fromHash) try { history.pushState(null, "", name === ALL ? "#lista" : PAGES[name] ? "#" + PAGES[name].hash : "#collezioni/" + slug(name)); } catch (e) {}
    clearTimeout(swapTimer);
    if (!listOpen) { renderSeries(name); listView.scrollTop = 0; setListOpen(true); markSwitch(); return; }
    if (name === currentSeries) { listView.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); return; }
    markSwitch();
    const swap = () => { renderSeries(name); listView.scrollTop = 0; listView.style.opacity = ""; markSwitch(); };
    if (reduceMotion) return swap();
    listView.style.opacity = "0";
    swapTimer = setTimeout(swap, 260);
  }
  function goGallery(fromHash) {
    if (!listOpen) return;
    if (!fromHash) try { history.pushState(null, "", location.pathname + location.search); } catch (e) {}

    markSwitch();

  listView.tabIndex = -1;
  document.querySelector(".logo").addEventListener("click", e => { e.preventDefault(); setColl(false); setMenu(false); goGallery(); });

  // l'indirizzo segue la navigazione, così il tasto Indietro del browser funziona
  function applyHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    const page = Object.keys(PAGES).find(n => PAGES[n].hash === h);
    const name = h === "lista" ? ALL : page ? page : seriesOrder.find(n => "collezioni/" + slug(n) === h);

  addEventListener("popstate", applyHash);
  for (const [name, pg] of Object.entries(PAGES))
    document.getElementById(pg.link).addEventListener("click", e => { e.preventDefault(); setColl(false); setMenu(false); showSeries(name); });
  viewBtns.forEach(b => b.addEventListener("click", () => { setColl(false); b.dataset.view === "lista" ? showSeries(ALL) : goGallery(); }));

  // ---------- Didascalia ----------
  const caption = document.getElementById("caption");
  const capSeries = document.getElementById("capSeries");
  const capTitle = document.getElementById("capTitle");
  function wrapArc(theta, phi) {
    let dAng = theta - phi;
    dAng = ((dAng % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
    return dAng * R; // positivo = davanti
  }

  // ---------- Loop ----------
  const walkNow = { pos: new THREE.Vector3(), q: new THREE.Quaternion() };
  const fwd = new THREE.Vector3(), tmpV = new THREE.Vector3(), flatF = new THREE.Vector3();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    if (!sheetOpen) {
      if (opt.guided && !snapped && now - lastInput > 380) { snapTarget(); snapped = true; }
      // molla smorzata: il passo accelera e frena in modo naturale, senza scatti quando inizi o smetti di scorrere
      if (reduceMotion) { pos = target; vel = 0; }
      else {
        const om = 5.2, steps = 4, h = dt / steps;
        for (let i = 0; i < steps; i++) { vel += (om * om * (target - pos) - 2 * om * vel) * h; pos += vel * h; }
      }
    }


    if (camAnim) {
      if (camAnim.t0 == null) camAnim.t0 = now;
      const t = Math.min(1, (now - camAnim.t0) / camAnim.dur);
      camAnim.step(t);
      if (t >= 1) { const done = camAnim.done; camAnim = null; done(); }
    } else if (focus) {
      camera.position.copy(focus.pos); camera.quaternion.copy(focus.q);
    } else {
      walkPose(pos, walkNow);
      camera.position.copy(walkNow.pos); camera.quaternion.copy(walkNow.q);
    }
    fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);

    flatF.set(fwd.x, 0, fwd.z).normalize();
    // didascalia: il primo quadro davanti che è davvero nell'inquadratura
    const theta = -pos / R;
    const halfH = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect) * 0.92;
    let capBest = -1, capD = Infinity;
    for (const g of frames) {
      const a = wrapArc(theta, g.userData.phi);
      if (a <= 0 || a > 9 || a >= capD) continue;
      tmpV.copy(g.position).sub(camera.position); tmpV.y = 0;
      const ang = Math.acos(Math.max(-1, Math.min(1, tmpV.normalize().dot(flatF))));
      if (ang < halfH) { capD = a; capBest = g.userData.work; }
    }
    // la luce resta sopra chi guarda, così non crea macchie quando ci si avvicina alla parete
    lamp.position.set(camera.position.x + fwd.x * 0.8, H - 0.5, camera.position.z + fwd.z * 0.8);

    if (!sheetOpen && capBest !== shownWork) {
      shownWork = capBest;
      if (capBest < 0) caption.classList.add("hidden-soft");
      else {
        capSeries.textContent = works[capBest].s;
        capTitle.textContent = works[capBest].t;
        if (walked) caption.classList.remove("hidden-soft");
      }
    }

    // con la lista completamente visibile il corridoio non serve: niente rendering
    const parked = listOpen && performance.now() - listSince > 600;
    if (parked !== canvasParked) { canvasParked = parked; canvas.style.visibility = parked ? "hidden" : ""; }
    if (!parked) renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Verticale = schermo più alto che largo (telefono, iPad tenuto in verticale)
  const layoutKey = () => (innerWidth / innerHeight < 1 ? "verticale" : "galleria");
  let currentKey = null;
  function fitCamera() {
    const aspect = innerWidth / innerHeight;
    camera.aspect = aspect;
    // in verticale si allarga il campo visivo, così la parete esterna resta nell'inquadratura
    const wanted = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(36)) / aspect);
    camera.fov = Math.min(80, Math.max(60, THREE.MathUtils.radToDeg(wanted)));
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight, false);
  }
  function applyLayout() {
    fitCamera();
    const key = layoutKey();
    if (focus && activeGroup && key === currentKey) {
      // schermo ridimensionato con la scheda aperta: il quadro resta allineato al suo riquadro
      focusPose(activeGroup, artBox.getBoundingClientRect(), poseB);
    }
    if (key === currentKey) return;
    if (sheetOpen) { sheet.classList.remove("open"); closeBtn.hidden = true; focus = null; camAnim = null; activeGroup = null; sheetOpen = false; }
    currentKey = key;
    buildWorld(key); // il punto del percorso resta lo stesso anche ruotando il dispositivo
  }
  applyLayout();
  addEventListener("resize", applyLayout);
  applyHash();
  requestAnimationFrame(frame);
})();
