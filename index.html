        const info = el("div", "lv-info");
        info.append(el("h3", null, a.t), el("p", null, a.tech));
        if (a.note) info.append(el("p", "lv-note", a.note)); // cornice: subito sotto la tecnica
        if (a.avail) {
          const cta = el("a", "lv-cta", "Richiedi informazioni");
          cta.href = `https://wa.me/${WA}?text=${encodeURIComponent(`Buongiorno, vorrei informazioni sull'opera "${a.t}" (Archivio ${y}).`)}`;
          cta.target = "_blank"; cta.rel = "noopener";
          info.append(cta);
        } else info.append(el("p", "lv-sold", "Già in collezione privata"));
        const desc = el("div", "lv-desc");
        desc.append(...a.desc.map(t => el("p", null, t))); // archivio: descrizione sempre intera, identica al sito, senza "Leggi tutto"
        info.append(desc);
        row.append(art, info);
        if (rowObserver) { row.classList.add("pre"); rowObserver.observe(row); }
        nodes.push(row);
      });
    }
    nodes.push(...siteFoot());
    listView.replaceChildren(...nodes);
  }
  const viewBtns = [...document.querySelectorAll(".view-switch button")];
  function markSwitch(next = currentSeries) {
    const v = listOpen && next === ALL ? "lista" : !listOpen ? "galleria" : "";
    viewBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    // Galleria/Lista solo nella galleria e in "Tutte le opere": nelle collezioni e nelle altre pagine si toglie
    document.body.classList.toggle("no-switch", listOpen && next !== ALL);
  }
  // name = una collezione, oppure ALL per tutte le opere nell'ordine della galleria
  function renderSeries(name) {
    if (name === ARCH) return renderArchive();
    if (name === ARTIST) return renderArtist();
    if (name === CONTACT) return renderContacts();
    if (name === PRIVACY) return renderPrivacy();
    currentSeries = name;
    markCurrent();
    const all = name === ALL;
    // in "Tutte le opere" le opere sono raggruppate per collezione, nell'ordine del menu
    const items = works.map((w, i) => [w, i]).filter(([w]) => all || w.s === name);
    if (all) items.sort((a, b) => seriesOrder.indexOf(a[0].s) - seriesOrder.indexOf(b[0].s));
    const crumbs = el("nav", "lv-crumbs");
    crumbs.setAttribute("aria-label", "Percorso");
    const home = el("button", null, "Galleria");
    home.type = "button";
    home.addEventListener("click", () => goGallery());
    crumbs.append(home, el("i", null, "›"), el("span", null, name), el("span", "lv-count", countLabel(items.length)));
    const nodes = [crumbs];
    const polyRow = () => {
      const row = el("article", "lv-row");
      row.id = "opera-" + fileSlug(POLYWORK.t);
      const art = el("div", "lv-art");
      const box = el("div", "lv-box");
      box.style.background = `#151515 url("${POLYWORK.img}") center / cover no-repeat`;
      box.style.aspectRatio = "1 / 1";
      box.style.width = "min(100%, 520px, calc(var(--art-vh) * 1))";
      box.setAttribute("role", "img"); box.setAttribute("aria-label", "Le quattro tele di Trame nella loro cornice");
      art.append(box);
      const info = el("div", "lv-info");
      info.append(
        el("h3", null, "Trame, polittico, 2026"),
        el("p", null, "Olio su tela, quattro elementi 40 × 40 cm")
      );
      const a = el("a", "lv-cta", "Richiedi informazioni");
      a.href = `https://wa.me/${WA}?text=${encodeURIComponent(`Buongiorno, vorrei informazioni sul polittico "${POLY}" con la cornice.`)}`;
      a.target = "_blank"; a.rel = "noopener";
      info.append(a, el("p", "lv-mount mount-gap", "Le quattro opere presentate insieme, nella loro cornice."));
      row.append(art, info);
      if (rowObserver) { row.classList.add("pre"); rowObserver.observe(row); }
      return row;
    };
    if (name === POLY) nodes.push(polyRow());
    let lastSeries = null;
    for (const [w, i] of items) {
      if (all && w.s !== lastSeries) {
        lastSeries = w.s;
        const bar = el("div", "lv-year");
        bar.append(el("h2", null, w.s), el("span", null, countLabel(works.filter(x => x.s === w.s).length)));
        nodes.push(bar);
        if (w.s === POLY) nodes.push(polyRow());
      }
      const row = el("article", "lv-row");
      row.id = "opera-" + fileSlug(w.t);
      const art = el("div", "lv-art");
      const box = el("div", "lv-box");
      const ratio = w.ar || w.w / w.h;
      box.style.background = `${hexOf(i)} url("${w.pic}") center / cover no-repeat`;
      box.style.aspectRatio = String(ratio);
      // in scala: le tele piccole restano piccole, le grandi crescono (con un limite in altezza)
      box.style.width = `min(100%, ${ratio >= 1 ? 520 : 400}px, calc(var(--art-vh) * ${ratio.toFixed(4)}))`; // stessa misura della scheda
      makeSlides(box, w, hexOf(i));
      if (w.ar) box.classList.add("framed-pic");
      art.append(box);
      const info = el("div", "lv-info");
      info.append(
        el("h3", null, `${w.t}, 2026`),
        el("p", null, w.tech)
      );
      if (w.note) info.append(el("p", "lv-note", w.note)); // nota sulla cornice, subito sotto la tecnica
      if (w.avail) {
        const a = el("a", "lv-cta", "Richiedi informazioni");
        a.href = `https://wa.me/${WA}?text=${encodeURIComponent(`Buongiorno, vorrei informazioni sull'opera "${w.t}" (${w.s}).`)}`;
        a.target = "_blank"; a.rel = "noopener";
        info.append(a);
      } else info.append(el("p", "lv-sold", "Già in collezione privata"));
      const desc = el("div", "lv-desc");
      desc.append(...descParts(w.desc));
      info.append(desc);
      if (w.mount) info.append(el("p", "lv-mount", w.mount));
      row.append(art, info);
      if (rowObserver) { row.classList.add("pre"); rowObserver.observe(row); }
      nodes.push(row);
    }
    nodes.push(...siteFoot());
    listView.replaceChildren(...nodes);
  }

  function setListOpen(open) {
    listOpen = open; listSince = performance.now();
    listView.classList.toggle("open", open);
    listView.setAttribute("aria-hidden", String(!open));
    if (open) { hint.classList.add("hidden-soft"); caption.classList.add("hidden-soft"); }
    else { vel = 0; target = pos; currentSeries = null; markCurrent(); if (!walked) hint.classList.remove("hidden-soft"); }
  }

  // apre una collezione: dalla galleria con una dissolvenza, da un'altra collezione cambiando il contenuto
  let swapTimer = 0;
  function scrollToWorkNow(work) {
    const row = document.getElementById("opera-" + fileSlug(work.t));
    if (!row) return;
    row.classList.remove("pre");
    listView.scrollTop = row.getBoundingClientRect().top - listView.getBoundingClientRect().top + listView.scrollTop - siteHeader.offsetHeight;
  }
  function scrollToWork(work) {
    const row = work && document.getElementById("opera-" + fileSlug(work.t));
    if (!row) return;
    const top = row.getBoundingClientRect().top - listView.getBoundingClientRect().top + listView.scrollTop - siteHeader.offsetHeight;
    listView.scrollTo({ top, behavior: reduceMotion ? "auto" : "smooth" });
  }
  function showSeries(name, fromHash, work) {
    // dal menu con la scheda aperta: si chiude la scheda e si va dritti alla pagina scelta
    if (sheetOpen) { if (!camAnim) sheetToSeries(name, work); return; }
    if (!fromHash) try { history.pushState(null, "", name === ALL ? "#lista" : PAGES[name] ? "#" + PAGES[name].hash : "#collezioni/" + slug(name)); } catch (e) {}
    clearTimeout(swapTimer);
    const jump = () => { if (work) scrollToWorkNow(work); };
    if (!listOpen) { renderSeries(name); fitDescs(listView); listView.scrollTop = 0; jump(); setListOpen(true); markSwitch(); return; }
    if (name === currentSeries) { if (work) scrollToWork(work); else listView.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); return; }
    markSwitch(name);
    const swap = () => { renderSeries(name); fitDescs(listView); listView.scrollTop = 0; jump(); listView.style.opacity = ""; markSwitch(); };
    if (reduceMotion) return swap();
    listView.style.opacity = "0";
    swapTimer = setTimeout(swap, 260);
  }
  function goGallery(fromHash) {
    if (!listOpen) return;
    if (!fromHash) try { history.pushState(null, "", location.pathname + location.search); } catch (e) {}
    setListOpen(false);
    markSwitch();
  }
  listView.tabIndex = -1;
  document.querySelector(".logo").addEventListener("click", e => { e.preventDefault(); setColl(false); setMenu(false); goGallery(); });

  // l'indirizzo segue la navigazione, così il tasto Indietro del browser funziona
  function applyHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    const page = Object.keys(PAGES).find(n => PAGES[n].hash === h);
    const name = h === "lista" ? ALL : page ? page : seriesOrder.find(n => "collezioni/" + slug(n) === h);
    if (name) showSeries(name, true);
    else goGallery(true);
  }
  addEventListener("popstate", applyHash);
  for (const [name, pg] of Object.entries(PAGES)) if (pg.link)
    document.getElementById(pg.link).addEventListener("click", e => { e.preventDefault(); setColl(false); setMenu(false); showSeries(name); });
  viewBtns.forEach(b => b.addEventListener("click", () => { setColl(false); b.dataset.view === "lista" ? showSeries(ALL) : goGallery(); }));

  // ---------- Didascalia ----------
  const caption = document.getElementById("caption");
  const capSeries = document.getElementById("capSeries");
  const capTitle = document.getElementById("capTitle");
  function wrapArc(theta, phi) {
    let dAng = theta - phi;
    dAng = ((dAng % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
    return dAng * R; // positivo = davanti
  }

  // ---------- Loop ----------
  const walkNow = { pos: new THREE.Vector3(), q: new THREE.Quaternion() };
  const fwd = new THREE.Vector3(), tmpV = new THREE.Vector3(), flatF = new THREE.Vector3();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    if (!sheetOpen) {
      if (opt.guided && !snapped && now - lastInput > 380) { snapTarget(); snapped = true; }
      // molla smorzata: il passo accelera e frena in modo naturale, senza scatti quando inizi o smetti di scorrere
      if (reduceMotion) { pos = target; vel = 0; }
      else {
        const om = 5.2, steps = 4, h = dt / steps;
        for (let i = 0; i < steps; i++) { vel += (om * om * (target - pos) - 2 * om * vel) * h; pos += vel * h; }
      }
    }


    if (camAnim) {
      if (camAnim.t0 == null) camAnim.t0 = now;
      const t = Math.min(1, (now - camAnim.t0) / camAnim.dur);
      camAnim.step(t);
      if (t >= 1) { const done = camAnim.done; camAnim = null; done(); }
    } else if (focus) {
      camera.position.copy(focus.pos); camera.quaternion.copy(focus.q);
    } else {
      walkPose(pos, walkNow);
      camera.position.copy(walkNow.pos); camera.quaternion.copy(walkNow.q);
    }
    fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);

    flatF.set(fwd.x, 0, fwd.z).normalize();
    // didascalia: il primo quadro davanti che è davvero nell'inquadratura
    const theta = -pos / R;
    const halfH = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect) * 0.92;
    let capBest = -1, capD = Infinity;
    for (const g of frames) {
      const a = wrapArc(theta, g.userData.phi);
      if (a <= 0 || a > 9 || a >= capD) continue;
      tmpV.copy(g.position).sub(camera.position); tmpV.y = 0;
      const ang = Math.acos(Math.max(-1, Math.min(1, tmpV.normalize().dot(flatF))));
      if (ang < halfH) { capD = a; capBest = g.userData.work; }
    }
    // la luce resta sopra chi guarda, così non crea macchie quando ci si avvicina alla parete
    lamp.position.set(camera.position.x + fwd.x * 0.8, H - 0.5, camera.position.z + fwd.z * 0.8);

    if (!sheetOpen && capBest !== shownWork) {
      shownWork = capBest;
      if (capBest < 0) caption.classList.add("hidden-soft");
      else {
        capSeries.textContent = works[capBest].s;
        capTitle.textContent = works[capBest].t;
        if (walked) caption.classList.remove("hidden-soft");
      }
    }

    // con la lista completamente visibile il corridoio non serve: niente rendering
    const parked = listOpen && performance.now() - listSince > 600;
    if (parked !== canvasParked) { canvasParked = parked; canvas.style.visibility = parked ? "hidden" : ""; }
    if (!parked) renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Verticale = schermo più alto che largo (telefono, iPad tenuto in verticale)
  const layoutKey = () => (innerWidth / innerHeight < 1 ? "verticale" : "galleria");
  let currentKey = null;
  function fitCamera() {
    const aspect = innerWidth / innerHeight;
    camera.aspect = aspect;
    // in verticale si allarga il campo visivo, così la parete esterna resta nell'inquadratura
    const wanted = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(36)) / aspect);
    camera.fov = Math.min(80, Math.max(60, THREE.MathUtils.radToDeg(wanted)));
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight, false);
  }
  function applyLayout() {
    fitCamera();
    const key = layoutKey();
    if (focus && activeGroup && key === currentKey) {
      // schermo ridimensionato con la scheda aperta: il quadro resta allineato al suo riquadro
      focusPose(activeGroup, targetRect(), poseB);
    }
    if (key === currentKey) return;
    if (sheetOpen) { sheet.classList.remove("open"); closeBtn.hidden = true; focus = null; camAnim = null; activeGroup = null; sheetOpen = false; }
    currentKey = key;
    buildWorld(key); // il punto del percorso resta lo stesso anche ruotando il dispositivo
  }
  applyLayout();
  addEventListener("resize", applyLayout);
  applyHash();
  requestAnimationFrame(frame);
})();
</script>
